- name: install auditd
  ansible.builtin.package:
      name: auditd
      state: present


- name: setting auditd
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: "{{ auditd_dir }}/auditd.conf"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart auditd


- name: rules auditd
  ansible.builtin.template:
    src: security.rules.j2
    dest: "{{ auditd_dir }}/rules.d/security.rules"
    owner: root
    group: root
    mode: "0644"
  notify: Load audit rules


- name: start auditd
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started



